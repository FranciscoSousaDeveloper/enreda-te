<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notícia — Enreda-te</title>

  <!-- Biblioteca para converter Markdown em HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --g: #246b55;
      --lg: #eaf5f0;
      --c: #fff8ee;
      --o: #e4a05b;
      --d: #24352f;
      --m: #697872;
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #ffffff; color: var(--d); }

    /* CABEÇALHO */
    header { background: var(--lg); padding: 20px; border-bottom: 1px solid #e5ece8; }
    header .wrap { max-width: 900px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 24px; font-weight: bold; color: var(--g); text-decoration: none; }
    .back-btn { text-decoration: none; color: var(--g); font-weight: bold; border: 2px solid var(--g); padding: 8px 18px; border-radius: 999px; }

    /* ESTRUTURA DO ARTIGO */
    .article-container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .date { color: var(--o); font-weight: bold; font-size: 14px; margin-bottom: 8px; }
    h1 { color: var(--g); font-size: clamp(28px, 4vw, 42px); margin: 0 0 16px; line-height: 1.2; }
    .summary { font-size: 20px; color: var(--m); font-weight: 500; margin-bottom: 30px; line-height: 1.5; border-left: 4px solid var(--o); padding-left: 16px; }
    
    .cover-image { width: 100%; max-height: 450px; object-fit: cover; border-radius: 20px; margin-bottom: 30px; }

    /* CONTEÚDO DO MARKDOWN */
    .content { font-size: 18px; line-height: 1.7; color: var(--d); }
    .content p { margin-bottom: 20px; }
    .content img { max-width: 100%; height: auto; border-radius: 12px; margin: 20px 0; }
    .content h2, .content h3 { color: var(--g); margin-top: 32px; }
    .content blockquote { background: var(--lg); padding: 16px 24px; border-left: 4px solid var(--g); margin: 24px 0; border-radius: 8px; }

    .loading-msg { text-align: center; color: var(--m); padding: 60px 20px; font-style: italic; font-size: 18px; }
  </style>
</head>
<body>

  <header>
    <div class="wrap">
      <a href="/" class="logo">Enreda-te</a>
      <a href="/noticias.html" class="back-btn">← Voltar às Notícias</a>
    </div>
  </header>

  <main class="article-container" id="article-content">
    <div class="loading-msg">A carregar notícia...</div>
  </main>

  <script>
    const REPO_USER = 'FranciscoSousaDeveloper';
    const REPO_NAME = 'enreda-te';
    const FOLDER_PATH = 'content/noticias';

    // Função para separar o Frontmatter (YAML) do Conteúdo (Markdown)
    function parseMarkdownFile(text) {
      const result = { meta: {}, content: '' };
      const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);

      if (match) {
        const yamlHeader = match[1];
        result.content = match[2];

        yamlHeader.split('\n').forEach(line => {
          const colonIdx = line.indexOf(':');
          if (colonIdx !== -1) {
            const key = line.slice(0, colonIdx).trim();
            let val = line.slice(colonIdx + 1).trim();
            if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1);
            result.meta[key] = val;
          }
        });
      } else {
        result.content = text;
      }

      return result;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      if (isNaN(date)) return dateStr;
      const day = String(date.getDate()).padStart(2, '0');
      const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      return `${day} de ${months[date.getMonth()]} de ${date.getFullYear()}`;
    }

    async function loadArticle() {
      const container = document.getElementById('article-content');
      const params = new URLSearchParams(window.location.search);
      const filename = params.get('file');

      if (!filename) {
        container.innerHTML = '<div class="loading-msg">Nenhuma notícia especificada.</div>';
        return;
      }

      try {
        const url = `https://raw.githubusercontent.com/${REPO_USER}/${REPO_NAME}/main/${FOLDER_PATH}/${filename}`;
        const response = await fetch(url);

        if (!response.ok) throw new Error('Notícia não encontrada.');

        const rawText = await response.text();
        const { meta, content } = parseMarkdownFile(rawText);

        // Converter o corpo em Markdown para HTML usando a biblioteca Marked
        const htmlBody = marked.parse(content);

        const photoHtml = meta.photo ? `<img src="${meta.photo}" alt="${meta.title}" class="cover-image">` : '';
        const summaryHtml = meta.summary ? `<p class="summary">${meta.summary}</p>` : '';

        container.innerHTML = `
          <article>
            <div class="date">${formatDate(meta.date)}</div>
            <h1>${meta.title || 'Sem Título'}</h1>
            ${summaryHtml}
            ${photoHtml}
            <div class="content">
              ${htmlBody}
            </div>
          </article>
        `;

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="loading-msg">Erro ao carregar a notícia. Verifica se o link está correto.</div>';
      }
    }

    loadArticle();
  </script>
</body>
</html>
