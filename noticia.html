<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todas as Notícias — Enreda-te</title>

  <style>
    :root {
      --g: #246b55;
      --lg: #eaf5f0;
      --c: #fff8ee;
      --o: #e4a05b;
      --d: #24352f;
      --m: #697872;
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #ffffff; color: var(--d); }

    /* --- CABEÇALHO DA PÁGINA --- */
    header { background: var(--lg); padding: 40px 20px; text-align: center; border-bottom: 1px solid #e5ece8; }
    header .wrap { max-width: 1180px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 24px; font-weight: bold; color: var(--g); text-decoration: none; }
    .back-btn { text-decoration: none; color: var(--g); font-weight: bold; border: 2px solid var(--g); padding: 8px 18px; border-radius: 999px; }

    .page-title { text-align: center; padding: 40px 20px 20px; }
    .page-title h1 { color: var(--g); font-size: 36px; margin: 0 0 10px; }
    .page-title p { color: var(--m); font-size: 18px; margin: 0; }

    /* --- GRELHA DE TODAS AS NOTÍCIAS --- */
    .noticias-sec { padding: 40px 20px 60px; }
    .wrap { max-width: 1180px; margin: auto; }
    .news-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .news-card { border: 1px solid #e5ece8; border-radius: 22px; overflow: hidden; background: white; box-shadow: 0 10px 30px #23483b12; display: flex; flex-direction: column; }
    .photo { height: 180px; background: linear-gradient(135deg, #d6e8e1, #f3d9bb); display: grid; place-items: center; color: var(--g); font-weight: bold; background-size: cover; background-position: center; }
    .news-body { padding: 20px; flex-grow: 1; }
    .date { font-size: 12px; color: var(--o); font-weight: bold; }
    .news-body h3 { color: var(--g); margin: 8px 0; font-size: 20px; }
    .news-body p { color: var(--m); font-size: 15px; margin: 0; line-height: 1.5; }
    .loading-msg { grid-column: 1 / -1; text-align: center; color: var(--m); padding: 40px; font-style: italic; }

    @media(max-width: 768px) {
      .news-grid { grid-template-columns: 1fr; }
      header .wrap { flex-direction: column; gap: 15px; }
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO COM NAVEGAÇÃO -->
  <header>
    <div class="wrap">
      <a href="/" class="logo">Enreda-te</a>
      <a href="/" class="back-btn">← Voltar à Página Inicial</a>
    </div>
  </header>

  <div class="page-title">
    <h1>Todas as Notícias</h1>
    <p>Acompanhe todas as atividades, projetos e novidades da associação.</p>
  </div>

  <!-- GRELHA COMPLETA -->
  <section class="noticias-sec">
    <div class="wrap">
      <div class="news-grid" id="all-news-container">
        <div class="loading-msg">A carregar todas as notícias...</div>
      </div>
    </div>
  </section>

  <!-- SCRIPT PARA CARREGAR TODAS AS NOTÍCIAS DO GITHUB -->
  <script>
    const REPO_USER = 'FranciscoSousaDeveloper';
    const REPO_NAME = 'enreda-te';
    const FOLDER_PATH = 'content/noticias';

    function parseFrontmatter(markdown) {
      const result = {};
      const match = markdown.match(/^---\r?\n([\s\S]*?)\r?\n---/);
      if (match) {
        const lines = match[1].split('\n');
        lines.forEach(line => {
          const colonIdx = line.indexOf(':');
          if (colonIdx !== -1) {
            const key = line.slice(0, colonIdx).trim();
            let val = line.slice(colonIdx + 1).trim();
            if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1);
            if (val === 'true') val = true;
            if (val === 'false') val = false;
            result[key] = val;
          }
        });
      }
      return result;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      if (isNaN(date)) return dateStr;
      const day = String(date.getDate()).padStart(2, '0');
      const months = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
      const month = months[date.getMonth()];
      const year = date.getFullYear();
      return `${day} ${month} ${year}`;
    }

    async function fetchAllNews() {
      const container = document.getElementById('all-news-container');
      try {
        const response = await fetch(`https://api.github.com/repos/${REPO_USER}/${REPO_NAME}/contents/${FOLDER_PATH}`);
        if (!response.ok) throw new Error('Erro ao aceder ao repositório.');
        
        const files = await response.json();
        const mdFiles = files.filter(f => f.name.endsWith('.md'));

        if (mdFiles.length === 0) {
          container.innerHTML = '<div class="loading-msg">Nenhuma notícia publicada até ao momento.</div>';
          return;
        }

        const newsList = [];

        for (const file of mdFiles) {
          const res = await fetch(file.download_url);
          const text = await res.text();
          const meta = parseFrontmatter(text);
          meta.filename = file.name;
          newsList.push(meta);
        }

        // Ordenar da mais recente para a mais antiga
        newsList.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

        container.innerHTML = '';
        newsList.forEach(item => {
          const photoBg = item.photo ? `style="background-image: url('${item.photo}'); color: transparent;"` : '';
          const card = document.createElement('div');
          card.className = 'news-card';
          card.innerHTML = `
            <div class="photo" ${photoBg}>${item.photo ? '' : 'FOTOGRAFIA'}</div>
            <div class="news-body">
              <div class="date">${formatDate(item.date)}</div>
              <h3>${item.title || 'Sem Título'}</h3>
              <p>${item.summary || ''}</p>
            </div>
          `;
          container.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="loading-msg">Erro ao carregar a lista de notícias.</div>';
      }
    }

    fetchAllNews();
  </script>
</body>
</html>
